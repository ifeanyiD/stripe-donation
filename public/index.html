<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faire un don</title>
<style>
    body { font-family: system-ui; max-width: 480px; margin: 40px auto; padding: 20px; }
    .card { border: 1px solid #eee; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
    input, button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; }
    button { background: #002395; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #001a70; }
    .amounts { display: flex; gap: 8px; }
    .amounts button { background: #f5f5f5; color: #000; }
    .amounts button.active { background: #002395; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <h2>Soutenez notre cause 🇫🇷</h2>
  <p>Don sécurisé par carte bancaire pour les résidents en France.</p>
  
  <div class="amounts">
    <button onclick="setAmount(10)">10€</button>
    <button onclick="setAmount(20)" class="active">20€</button>
    <button onclick="setAmount(50)">50€</button>
  </div>

  <input type="number" id="amount" value="20" min="1" placeholder="Montant personnalisé">
  <input type="email" id="email" placeholder="Votre email (reçu fiscal)">
  <button id="donate">Faire un don avec ma carte</button>
  <p style="font-size:12px;color:#777">Paiement sécurisé via Stripe. Cartes CB acceptées.</p>
</div>

    <script>
        let selectedAmount = 20;
        function setAmount(v){ 
            selectedAmount = v; 
            document.getElementById('amount').value = v;
            document.querySelectorAll('.amounts button').forEach(b=>b.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('donate').onclick = async () => {
        const amount = document.getElementById('amount').value;
        const email = document.getElementById('email').value;
        if(!email) return alert('Veuillez entrer votre email');
        
        const res = await fetch('/create-checkout-session', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ amount: amount*100, email }) // Stripe uses centimes
        });
        const data = await res.json();
        window.location = data.url;
        }
    </script>
</body>
</html>
